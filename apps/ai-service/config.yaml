service:
  name: "@app/ai-service"
  port: 8000
  host: "0.0.0.0"

providers:
  google:
    default_model: "gemini-2.5-flash"
    fallback_model: "gemini-1.5-flash"
  openai:
    default_model: "gpt-4o"
    fallback_model: "gpt-4o-mini"

inference:
  temperature: 0.7
  max_output_tokens: 2048
  rate_limit_per_minute: 60
